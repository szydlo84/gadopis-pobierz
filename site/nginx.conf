# Static site behind Coolify's proxy (Traefik terminates HTTPS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # One address for search engines: www moves to gadopis.pl for good.
    if ($host = www.gadopis.pl) {
        return 301 https://gadopis.pl$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml font/ttf text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    # The page itself is always revalidated; assets are cached for a month.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location ~* \.(?:html|css|js)$ {
        expires -1;
    }

    location ~* \.ttf$ {
        default_type font/ttf;
        expires 30d;
    }

    location /assets/ {
        expires 30d;
    }

    # Pages answer without ".html" (/prywatnosc).
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }
}
