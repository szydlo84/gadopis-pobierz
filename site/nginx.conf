# Static site behind Coolify's proxy (Traefik terminates HTTPS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml font/ttf text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The page itself is always revalidated; assets are cached for a month.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location ~* \.(?:html|css|js)$ {
        expires -1;
    }

    location ~* \.ttf$ {
        default_type font/ttf;
        expires 30d;
    }

    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
